<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

  <title>65周年</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="message">
    「箱」に触れてください
  </div>

  <div id="game-container"></div>

  <div id="controls">

    <button class="move" onclick="move(0,-1)">↑</button>

    <div class="middle">
      <button class="move" onclick="move(-1,0)">←</button>

      <button id="restart" onclick="initGame()">
        RESTART
      </button>

      <button class="move" onclick="move(1,0)">→</button>
    </div>

    <button class="move" onclick="move(0,1)">↓</button>

  </div>

  <div id="overlay">
    <div id="clear-text">
      次の65年へ。<br><br>
      65周年ありがとうございます。
    </div>
  </div>

  <div id="door-effect">
    <div id="door-left">扉</div>
    <div id="door-right">扉</div>
  </div>

  <script src="app.js"></script>

</body>
</html>
