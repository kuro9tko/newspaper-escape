<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

  <title>65周年</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body class="game-not-started">
  <div id="start-screen">
    <img
      id="start-logo"
      src="./images/start-logo.png"
      alt="読売新聞北陸発刊65周年記念"
    />

    <div id="start-title">読売新聞北陸発刊65周年記念</div>

    <div id="start-subtitle">
      活字（吾）を操作し、キーワードをつくる。
    </div>
    <!-- <div id="start-help">
      矢印で移動 / 文字を押す
    </div> -->

    <button id="sound-button" type="button" aria-label="音設定">
      ♪
    </button>

    <div id="sound-backdrop" class="hidden"></div>

    <div id="sound-popup" class="hidden">
      <div id="sound-popup-title">音設定</div>

      <div id="sound-settings">
        <label class="sound-row">
          <span>BGM</span>
          <input id="bgm-toggle" type="checkbox" checked>
        </label>

        <label class="sound-row">
          <span>BGM音量</span>
          <input id="bgm-volume" type="range" min="0" max="1" step="0.05" value="0.35">
        </label>

        <label class="sound-row">
          <span>SE</span>
          <input id="se-toggle" type="checkbox" checked>
        </label>

        <label class="sound-row">
          <span>SE音量</span>
          <input id="se-volume" type="range" min="0" max="1" step="0.05" value="0.7">
        </label>
      </div>
    </div>

    <button id="start-button">
      START
    </button>
  </div>

  <div id="message"></div>
  <div id="stage-label"></div>

  <div id="game-container"></div>

  <div id="controls">

  <div id="control-pad">
      <button class="move up" data-dx="0" data-dy="-1">↑</button>

      <div class="middle">
        <button class="move left" data-dx="-1" data-dy="0">←</button>
        <button class="move right" data-dx="1" data-dy="0">→</button>
      </div>

      <button class="move down" data-dx="0" data-dy="1">↓</button>
    </div>

    <button id="restart" aria-label="リスタート">
      ↺
    </button>

  </div>

  <div id="overlay">
    <div id="clear-text">
      65周年、そしてその先へ。<br><br>
      皆様に心から感謝申し上げます。
    </div>
  </div>

  <div id="keyword-effect"></div>
  <div id="ending65-effect">
    <!-- <div id="ending65-kanji">六五</div> -->
    <div id="ending65-number">65</div>
  </div>
  <div id="door-effect">
    <div id="door-left">門</div>
    <div id="door-right">門</div>
  </div>

  <script src="app.js"></script>

</body>
</html>
