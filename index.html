<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

  <title>65周年</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="message">
    
  </div>

  <div id="game-container"></div>

  <div id="controls">

    <button class="move" data-dx="0" data-dy="-1">↑</button>

    <div class="middle">
      <button class="move" data-dx="-1" data-dy="0">←</button>

      <button id="restart" onclick="restartStage()">
        RESTART
      </button>

      <button class="move" data-dx="1" data-dy="0">→</button>
    </div>

    <button class="move" data-dx="0" data-dy="1">↓</button>

  </div>

  <div id="overlay">
    <div id="clear-text">
      65周年、そしてその先へ。<br><br>
      皆様に心から感謝申し上げます。
    </div>
  </div>

  <div id="keyword-effect"></div>
  <div id="door-effect">
    <div id="door-left">門</div>
    <div id="door-right">門</div>
  </div>

  <script src="app.js"></script>

</body>
</html>
